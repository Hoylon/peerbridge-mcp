name: Published release VM acceptance

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact published release tag to verify
        required: true
        type: string
      asset:
        description: Exact Windows portable ZIP asset name
        required: true
        type: string
      sha256:
        description: Independently copied lowercase SHA-256 for the ZIP
        required: true
        type: string

permissions:
  contents: read

jobs:
  clean-windows-vm:
    timeout-minutes: 20
    runs-on: windows-2025
    steps:
      - name: Validate exact release inputs
        id: inputs
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_ASSET: ${{ inputs.asset }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$') {
            throw 'The release tag format is invalid.'
          }
          if ($env:RELEASE_ASSET -cnotmatch '^PeerBridgeControlRoom-[0-9]+\.[0-9]+\.[0-9]+a[0-9]+-windows-x64-portable\.zip$') {
            throw 'The release asset name is invalid.'
          }
          if ($env:EXPECTED_SHA256 -cnotmatch '^[0-9a-f]{64}$') {
            throw 'The independently supplied SHA-256 is invalid.'
          }
          "release_ref=refs/tags/$($env:RELEASE_TAG)" | Out-File `
            -FilePath $env:GITHUB_OUTPUT `
            -Append `
            -Encoding utf8
      - name: Check out the exact published tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.inputs.outputs.release_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Bind the checked-out release commit
        id: source
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($commit -cnotmatch '^[0-9a-f]{40}$') {
            throw 'The checked-out release commit is invalid.'
          }
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Download all public release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_ASSET: ${{ inputs.asset }}
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'published-release'
          New-Item -ItemType Directory -Path $download -ErrorAction Stop | Out-Null
          gh release download $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --dir $download
          $assetPath = Join-Path $download $env:RELEASE_ASSET
          if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
            throw 'The exact published release asset was not downloaded.'
          }
      - name: Verify the downloaded app and live HTTPS announcement feed
        id: acceptance
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_ASSET: ${{ inputs.asset }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          if ($env:EXPECTED_SHA256 -cnotmatch '^[0-9a-f]{64}$') {
            throw 'The independently supplied SHA-256 is invalid.'
          }
          $assetPath = Join-Path `
            (Join-Path $env:RUNNER_TEMP 'published-release') `
            $env:RELEASE_ASSET
          $receiptRoot = Join-Path $env:RUNNER_TEMP 'published-release-acceptance'
          $verificationJson = & ./scripts/verify_windows_portable.ps1 `
            -Archive $assetPath `
            -ExpectedSha256 $env:EXPECTED_SHA256 `
            -OutputRoot $receiptRoot `
            -Headless
          $verification = $verificationJson | ConvertFrom-Json
          if ($verification.Status -ne 'PASS') {
            throw 'The published Windows release failed clean-VM acceptance.'
          }
          $provenanceJson = & python scripts/verify_portable_provenance.py `
            --artifact-root (Join-Path $env:RUNNER_TEMP 'published-release') `
            --project-root . `
            --expected-commit $env:SOURCE_COMMIT `
            --expected-archive-name $env:RELEASE_ASSET `
            --expected-archive-sha256 $env:EXPECTED_SHA256
          $provenance = $provenanceJson | ConvertFrom-Json
          if ($provenance.status -ne 'PASS') {
            throw 'The published Windows release failed source provenance verification.'
          }
          if ($provenance.archive -cne $env:RELEASE_ASSET) {
            throw 'The provenance receipt selected a different release asset.'
          }
          if ($provenance.archive_sha256 -cne $env:EXPECTED_SHA256) {
            throw 'The provenance receipt selected a different release digest.'
          }
          if ($verification.ArchiveSha256 -cne $env:EXPECTED_SHA256) {
            throw 'The lifecycle verifier selected a different release digest.'
          }
          $receiptPath = Join-Path $receiptRoot 'published-release-vm-acceptance.json'
          [ordered]@{
            schema = 'peerbridge.published-release-vm-acceptance.v1'
            status = 'PASS'
            repository = $env:GITHUB_REPOSITORY
            tag = $env:RELEASE_TAG
            asset = $env:RELEASE_ASSET
            archive_sha256 = $verification.ArchiveSha256
            source_commit = $env:SOURCE_COMMIT
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            verification = $verification
            provenance = $provenance
          } | ConvertTo-Json -Depth 8 | Set-Content `
            -LiteralPath $receiptPath `
            -Encoding utf8NoBOM `
            -NoNewline
          "receipt=$receiptPath" | Out-File `
            -FilePath $env:GITHUB_OUTPUT `
            -Append `
            -Encoding utf8
      - name: Retain the clean-VM acceptance receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: published-release-vm-acceptance-${{ inputs.tag }}
          path: ${{ steps.acceptance.outputs.receipt }}
          if-no-files-found: error
          retention-days: 90
