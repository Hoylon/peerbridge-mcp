name: Feature request
description: Propose a bounded coordination or integration capability.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Coordination problem
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Proposed behavior and security boundary
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Integration type
      options: [Local stdio MCP, Authenticated HTTP MCP, API runner, Monitor, Other]
    validations:
      required: true
