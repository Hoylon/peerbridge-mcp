name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements/pip-bootstrap.lock
            requirements/ci-dev.lock
      - run: 'python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements/pip-bootstrap.lock'
      - run: 'python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements/ci-dev.lock'
      - run: python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - run: python -m pytest
      - if: matrix.os == 'macos-14'
        name: Re-run the live macOS Seatbelt boundary gate explicitly
        run: python -m pytest -q tests/test_macos_sandbox.py
      - run: python -m compileall -q src tests examples
      - run: python examples/demo_workflow.py --workspace demo-workspace
      - run: peerbridge doctor --project-root demo-workspace --scope demo
      - run: python scripts/release_check.py
      - run: python scripts/release_check.py --build-check
      - if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.13'
        run: python scripts/verify_continuity_manifest.py

  edge-contract:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: support/cloudflare-edge
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: support/cloudflare-edge/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Test Google Apps Script feedback receiver contract
        run: node --test ../google-apps-script/tests/receiver.test.mjs

  windows-portable-contract:
    timeout-minutes: 30
    runs-on: windows-2025
    outputs:
      archive_sha256: ${{ steps.portable.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements/pip-bootstrap.lock
            requirements/windows-build.lock
      - run: 'python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements/pip-bootstrap.lock'
      - run: python -m pip install --disable-pip-version-check --require-hashes --no-build-isolation -r requirements/windows-build.lock
      - run: python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Build and verify portable startup lifecycle
        id: portable
        shell: pwsh
        run: |
          $packageJson = & ./scripts/package_windows_portable.ps1 `
            -PythonPath (Get-Command python).Source `
            -OutputRoot (Join-Path $env:RUNNER_TEMP 'peerbridge-portable-package')
          $package = $packageJson | ConvertFrom-Json
          $verificationJson = & ./scripts/verify_windows_portable.ps1 `
            -Archive $package.Archive `
            -ExpectedSha256 $package.Sha256 `
            -OutputRoot (Join-Path $env:RUNNER_TEMP 'peerbridge-portable-verification') `
            -Headless `
            -SkipLiveAnnouncement
          $verification = $verificationJson | ConvertFrom-Json
          if (
            $verification.Status -ne 'PASS' -or
            $verification.ArchiveSha256 -cne $package.Sha256
          ) {
            throw 'Windows portable lifecycle verification did not pass.'
          }
          "archive=$($package.Archive)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "provenance=$($package.Provenance)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sbom=$($package.Sbom)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "licenses=$($package.LicenseManifest)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$($package.Sha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $verificationJson
      - name: Retain the exact verified portable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: peerbridge-windows-portable-${{ github.sha }}
          path: |
            ${{ steps.portable.outputs.archive }}
            ${{ steps.portable.outputs.provenance }}
            ${{ steps.portable.outputs.sbom }}
            ${{ steps.portable.outputs.licenses }}
          if-no-files-found: error
          retention-days: 30

  clean-windows-release-gate:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-portable-contract]
    timeout-minutes: 25
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Download the retained portable package into a clean runner
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: peerbridge-windows-portable-${{ github.sha }}
          path: retained-portable
      - name: Verify clean-VM lifecycle, live announcement and provenance
        id: clean_vm
        shell: pwsh
        env:
          EXPECTED_SHA256: ${{ needs.windows-portable-contract.outputs.archive_sha256 }}
        run: |
          if ($env:EXPECTED_SHA256 -cnotmatch '^[0-9a-f]{64}$') {
            throw 'The retained portable digest is invalid.'
          }
          $archives = @(Get-ChildItem -LiteralPath retained-portable -Recurse -File -Filter '*.zip')
          if ($archives.Count -ne 1) {
            throw "Expected exactly one retained portable ZIP, found $($archives.Count)."
          }
          $receiptRoot = Join-Path $env:RUNNER_TEMP 'peerbridge-clean-vm-verification'
          $verificationJson = & ./scripts/verify_windows_portable.ps1 `
            -Archive $archives[0].FullName `
            -ExpectedSha256 $env:EXPECTED_SHA256 `
            -OutputRoot $receiptRoot `
            -Headless
          $verification = $verificationJson | ConvertFrom-Json
          if ($verification.Status -ne 'PASS') {
            throw 'The clean Windows VM lifecycle gate did not pass.'
          }
          $provenanceJson = & python scripts/verify_portable_provenance.py `
            --artifact-root retained-portable `
            --project-root . `
            --expected-commit $env:GITHUB_SHA `
            --expected-archive-name $archives[0].Name `
            --expected-archive-sha256 $env:EXPECTED_SHA256
          $provenance = $provenanceJson | ConvertFrom-Json
          if ($provenance.status -ne 'PASS') {
            throw 'The clean Windows VM provenance gate did not pass.'
          }
          if (
            $provenance.archive -cne $archives[0].Name -or
            $provenance.archive_sha256 -cne $env:EXPECTED_SHA256 -or
            $verification.ArchiveSha256 -cne $env:EXPECTED_SHA256
          ) {
            throw 'The clean Windows VM gates did not bind the same archive and digest.'
          }
          $receipt = Join-Path $receiptRoot 'clean-windows-release-gate.json'
          [ordered]@{
            schema = 'peerbridge.clean-windows-release-gate.v1'
            status = 'PASS'
            source_commit = $env:GITHUB_SHA
            archive_sha256 = $verification.ArchiveSha256
            lifecycle = $verification
            provenance = $provenance
          } | ConvertTo-Json -Depth 10 | Set-Content `
            -LiteralPath $receipt -Encoding utf8NoBOM -NoNewline
          "receipt=$receipt" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Retain the pre-publication clean-VM receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clean-windows-release-gate-${{ github.sha }}
          path: ${{ steps.clean_vm.outputs.receipt }}
          if-no-files-found: error
          retention-days: 90

  release-gate:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, edge-contract, windows-portable-contract, clean-windows-release-gate]
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rehydrate annotated release tag
        shell: bash
        run: |
          git fetch --force origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements/pip-bootstrap.lock
            requirements/ci-dev.lock
      - run: 'python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements/pip-bootstrap.lock'
      - run: 'python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements/ci-dev.lock'
      - run: python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - run: python scripts/release_check.py --release --release-profile local-alpha --dist-dir dist
      - run: python scripts/verify_continuity_manifest.py --release-profile local-alpha
      - name: Download the exact verified Windows portable artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: peerbridge-windows-portable-${{ github.sha }}
          path: retained-portable
      - name: Verify retained portable provenance
        run: >-
          python scripts/verify_portable_provenance.py
          --artifact-root retained-portable
          --project-root .
          --expected-commit "${{ github.sha }}"
      - name: Assemble release assets and checksums
        shell: python
        run: |
          import hashlib
          import shutil
          from pathlib import Path

          output = Path("release-assets")
          output.mkdir()
          inputs = [
              *sorted(path for path in Path("dist").iterdir() if path.is_file()),
              *sorted(path for path in Path("retained-portable").rglob("*") if path.is_file()),
          ]
          for source in inputs:
              target = output / source.name
              if target.exists():
                  raise SystemExit(f"duplicate release asset name: {target.name}")
              shutil.copy2(source, target)
          lines = []
          for path in sorted(output.iterdir()):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {path.name}")
          (output / "SHA256SUMS.txt").write_text(
              "\n".join(lines) + "\n", encoding="utf-8", newline="\n"
          )
      - name: Retain the exact publication input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: peerbridge-release-publication-${{ github.sha }}
          path: |
            release-assets
            docs/GITHUB_ALPHA_5_6_RELEASE_DRAFT_20260825.md
          if-no-files-found: error
          retention-days: 7

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-gate]
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download the verified publication input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: peerbridge-release-publication-${{ github.sha }}
          path: release-publication
      - name: Attest verified release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-publication/release-assets/*
          create-storage-record: false
      - name: Publish GitHub Alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --verify-tag
          --latest
          --title "PeerBridge MCP ${GITHUB_REF_NAME}"
          --notes-file release-publication/docs/GITHUB_ALPHA_5_6_RELEASE_DRAFT_20260825.md
          release-publication/release-assets/*
