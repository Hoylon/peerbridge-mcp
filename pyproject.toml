[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "peerbridge-mcp"
version = "0.1.0a4"
description = "Local-first, auditable MCP coordination for equal AI coding peers and their human operator."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "TRADEMARKS.md", "BRAND_ASSETS.md", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Hoylon" }]
keywords = ["mcp", "multi-agent", "codex", "claude-code", "sqlite", "human-in-the-loop"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.optional-dependencies]
feedback = ["cryptography>=50,<51"]
dev = [
  "build==1.5.0",
  "cryptography==50.0.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "setuptools==84.0.0",
  "wheel==0.48.0",
]
windows = ["cryptography==50.0.0", "pyinstaller==6.22.1"]

[project.scripts]
peerbridge = "peerbridge_mcp.cli:main"
peerbridge-monitor = "peerbridge_mcp.monitor:main"
peerbridge-supervisor = "peerbridge_mcp.cli:supervisor_main"
peerbridge-remote = "peerbridge_mcp.remote:main"
peerbridge-remote-evidence = "peerbridge_mcp.remote_evidence:main"
peerbridge-provider-receipt = "peerbridge_mcp.provider_receipt:capture_main"
peerbridge-verify-provider-receipt = "peerbridge_mcp.provider_receipt:verify_main"
peerbridge-mcp-client-receipt = "peerbridge_mcp.mcp_client_receipt:capture_main"
peerbridge-verify-mcp-client-receipt = "peerbridge_mcp.mcp_client_receipt:verify_main"
peerbridge-acp-client-receipt = "peerbridge_mcp.acp_client_receipt:capture_main"
peerbridge-verify-acp-client-receipt = "peerbridge_mcp.acp_client_receipt:verify_main"
peerbridge-claude-client-receipt = "peerbridge_mcp.claude_client_receipt:capture_main"
peerbridge-verify-claude-client-receipt = "peerbridge_mcp.claude_client_receipt:verify_main"
peerbridge-collaboration-receipt = "peerbridge_mcp.collaboration_receipt:capture_main"
peerbridge-verify-collaboration-receipt = "peerbridge_mcp.collaboration_receipt:verify_main"
peerbridge-continuity = "peerbridge_mcp.continuity:main"
peerbridge-room-fanout-receipt = "peerbridge_mcp.room_fanout_receipt:capture_main"
peerbridge-verify-room-fanout-receipt = "peerbridge_mcp.room_fanout_receipt:verify_main"
peerbridge-local-alpha-soak = "peerbridge_mcp.local_alpha_soak:main"

[project.urls]
Homepage = "https://github.com/hoylon/peerbridge-mcp"
Repository = "https://github.com/hoylon/peerbridge-mcp"
Issues = "https://github.com/hoylon/peerbridge-mcp/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
peerbridge_mcp = ["release_support/*.ico", "release_support/*.json", "release_support/*.pub", "release_support/*.png"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
